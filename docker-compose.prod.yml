# 服务器上用的编排。本机开发还是用 docker-compose.yml，两个文件互不影响。
#
# 和开发版的三个区别：
#   1. 源码编译在 build 阶段完成，容器启动只 exec 二进制（见 docker/Dockerfile.prod）；
#   2. 数据库不映射端口，公网连不到 3306；
#   3. 密码和密钥从同目录的 .env 读取，文件里不写明文。
#
# 用法（服务器上）：
#   cp .env.example .env && vi .env     # 填密码
#   docker build -t cangjie:1.1.3 ./docker    # 先造工具链镜像，只做一次
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME:-changxi}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
      # 注意：这个目录里的脚本只在数据卷为空时执行一次。
      # 以后改表结构不会自动生效，得手动进库执行。
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
    # 故意不写 ports：只有 app 容器能通过服务名 db 连进来

  app:
    build:
      context: .                      # 需要 COPY src/，所以是仓库根目录
      dockerfile: docker/Dockerfile.prod
    image: changxi-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 告诉 Spire「我在容器里」，它据此绑 0.0.0.0
      - CANGJIE_RUNNING_IN_CONTAINER=true
      # 配置覆盖：前缀 cangjie_，层级用双下划线
      - cangjie_Database__Host=db
      - cangjie_Database__Port=3306
      - cangjie_Database__User=${DB_USER}
      - cangjie_Database__Password=${DB_PASSWORD}
      - cangjie_Database__Name=${DB_NAME:-changxi}
      - cangjie_Jwt__Secret=${JWT_SECRET}
      # AI 伴学（可选）
      - DIFY_API_KEY=${DIFY_API_KEY:-}
      - DIFY_API_BASE=${DIFY_API_BASE:-}
    ports:
      # APP_PORT 只是宿主机端口，容器里固定 5000
      - "${APP_PORT:-8080}:5000"

volumes:
  db-data:
