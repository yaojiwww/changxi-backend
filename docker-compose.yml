services:
  db:
    image: mariadb:11.4
    platform: linux/arm64
    environment:
      MARIADB_ROOT_PASSWORD: changxi_root
      MARIADB_DATABASE: changxi
      MARIADB_USER: yaojiw
      MARIADB_PASSWORD: 123456
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
  dev:          
    build: ./docker
    image: cangjie:1.1.3
    platform: linux/arm64
    environment:
      # 告诉 Spire「我在容器里」。它据此决定绑 0.0.0.0 而不是 127.0.0.1
      # （见 soulsoft_web_hosting/src/DefaultServer.cj 的 isRunningInContainer）
      - CANGJIE_RUNNING_IN_CONTAINER=true
      - SPIRE_PATH=/opt/spire/
      # 配置覆盖走 Spire 的约定：前缀 cangjie_，层级用双下划线。
      # cangjie_Database__Host  →  配置项 Database:Host（见 appsettings.json）
      # 单下划线不是层级分隔符，写成 cangjie_Database_Host 是不生效的。
      - cangjie_Database__Host=db
      - cangjie_Database__Port=3306
      - cangjie_Database__User=yaojiw
      - cangjie_Database__Password=123456
      - cangjie_Database__Name=changxi
      # AI 伴学：Dify 的密钥只在宿主机环境变量里（~/.zshrc），不进代码也不进
      # appsettings.json（那个文件是要提交的），所以必须在这里显式透传进容器。
      # 末尾的 ${VAR:-} 是"没设就当空串"，不加的话没设时会打印一堆警告。
      - DIFY_API_KEY=${DIFY_API_KEY:-}
      # 自建版 Dify 才需要；不设或为空时后端用云端 https://api.dify.ai/v1
      - DIFY_API_BASE=${DIFY_API_BASE:-}
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:5000"
    volumes:
      - ./src:/app/src
      - ./appsettings.json:/app/appsettings.json:ro
      - ./cjpm.toml:/app/cjpm.toml
      - ./cjpm.lock:/app/cjpm.lock
      - ./mariadb_driver:/app/mariadb_driver
      - ${SPIRE_PATH}:/opt/spire:ro
      - ./target:/app/target
    command: bash -c "cjpm build && exec ./target/release/bin/main"

volumes:
  db-data:

