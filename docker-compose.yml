services:
  db:
    image: mariadb:11.4
    platform: linux/arm64
    environment:
      MARIADB_ROOT_PASSWORD: changxi_root
      MARIADB_DATABASE: changxi
      MARIADB_USER: yaojiw
      MARIADB_PASSWORD: 123456
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
  dev:          
    build: ./docker
    image: cangjie:1.1.3
    platform: linux/arm64
    environment:
      # 告诉 Spire「我在容器里」。它据此决定绑 0.0.0.0 而不是 127.0.0.1
      # （见 soulsoft_web_hosting/src/DefaultServer.cj 的 isRunningInContainer）
      - CANGJIE_RUNNING_IN_CONTAINER=true
      - SPIRE_PATH=/opt/spire/
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=yaojiw
      - DB_PASS=123456
      - DB_NAME=changxi
      - CHANGXI_DEV_MODE=1
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:5000"
    volumes:
      - ./src:/app/src
      - ./cjpm.toml:/app/cjpm.toml
      - ./cjpm.lock:/app/cjpm.lock
      - ./mariadb_driver:/app/mariadb_driver
      - ${SPIRE_PATH}:/opt/spire:ro
      - ./target:/app/target
    command: bash -c "cjpm build && exec ./target/release/bin/main"

volumes:
  db-data:

