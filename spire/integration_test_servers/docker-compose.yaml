# 这个 compose 文件用于一次性拉取 Spire 仓库并运行测试。
# 执行 docker compose up 后，容器会：
# 1. 按 REPO_URL / REPO_BRANCH 拉取或更新代码
# 2. 启动 integration_test_servers 下的集成测试服务
# 3. 默认在各仓颉模块根目录执行 cjpm test
#    如果设置 SKIP_CANGJIE_TESTS=true，则跳过这一步
# 4. 在 integration_test_servers/*/test_server/tests 下执行 python -m pytest -v tests
# 5. 打印最终测试报告后退出
services:
  cangjie-dev:
    build:
      context: .
    environment:
      REPO_URL: "https://gitcode.com/soulsoft/spire.git"
      REPO_BRANCH: "dev"
      SPIRE_PATH: "/workspace/spire/"
      SKIP_CANGJIE_TESTS: "false"
    volumes:
      - .:/opt/integration_test_servers:ro
    command: ["python", "/opt/integration_test_servers/compose_start.py"]
