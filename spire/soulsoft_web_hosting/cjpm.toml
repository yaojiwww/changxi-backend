[package]
  cjc-version = "1.1.0"
  description = "Web 托管库，支持 HTTP 请求处理管道、应用构建和生命周期管理。"
  name = "soulsoft_web_hosting"
  output-type = "static"
  version = "1.0.0"


[dependencies]
  soulsoft_web_http = { path = "../soulsoft_web_http"}
  soulsoft_web_routing = { path = "../soulsoft_web_routing"}
  soulsoft_identity_claims = { path = "../soulsoft_identity_claims"}
  soulsoft_extensions_hosting = { path = "../soulsoft_extensions_hosting"}
  soulsoft_extensions_logging = { path = "../soulsoft_extensions_logging"}
  soulsoft_extensions_options = { path = "../soulsoft_extensions_options"}
  soulsoft_extensions_injection = { path = "../soulsoft_extensions_injection"}
  soulsoft_extensions_configuration = { path = "../soulsoft_extensions_configuration"}
  soulsoft_extensions_logging_console = { path = "../soulsoft_extensions_logging_console"}
  soulsoft_extensions_logging_configuration = { path = "../soulsoft_extensions_logging_configuration"}

[target]
  [target.x86_64-w64-mingw32]
    compile-option = "-Woff unused --diagnostic-format=noColor -Woff deprecated -lcrypt32 -lcangjie-dynamicLoader-opensslFFI"
    [target.x86_64-w64-mingw32.bin-dependencies]
      path-option = [ "${CANGJIE_STDX_PATH}" ]
  [target.x86_64-unknown-linux-gnu]
    compile-option = "-Woff unused --diagnostic-format=noColor -Woff deprecated -ldl -lcangjie-dynamicLoader-opensslFFI"
    [target.x86_64-unknown-linux-gnu.bin-dependencies]
      path-option = [ "${CANGJIE_STDX_PATH}" ]
  [target.aarch64-unknown-linux-gnu]
    compile-option = "-Woff unused --diagnostic-format=noColor -Woff deprecated -ldl -lcangjie-dynamicLoader-opensslFFI"
    [target.aarch64-unknown-linux-gnu.bin-dependencies]
      path-option = [ "${CANGJIE_STDX_PATH}" ]
