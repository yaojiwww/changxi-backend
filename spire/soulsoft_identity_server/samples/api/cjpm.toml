[package]
  cjc-version = "1.0.3"
  name = "api"
  description = "nothing here"
  version = "1.0.0"
  target-dir = ""
  src-dir = ""
  output-type = "executable"
  compile-option = ""
  override-compile-option = ""
  link-option = ""
  package-configuration = {}

[dependencies]
  soulsoft_web_cors = { path = "${SPIRE_PATH}soulsoft_web_cors"}
  soulsoft_web_http = { path = "${SPIRE_PATH}soulsoft_web_http"}
  soulsoft_web_routing = { path = "${SPIRE_PATH}soulsoft_web_routing"}
  soulsoft_web_hosting = { path = "${SPIRE_PATH}soulsoft_web_hosting"}
  soulsoft_web_authorization = { path = "${SPIRE_PATH}soulsoft_web_authorization"}
  soulsoft_web_authentication = { path = "${SPIRE_PATH}soulsoft_web_authentication"}
  soulsoft_extensions_injection = { path = "${SPIRE_PATH}soulsoft_extensions_injection"}
  soulsoft_web_authentication_jwtbearer = { path = "${SPIRE_PATH}soulsoft_web_authentication_jwtbearer"}

[target]
  [target.x86_64-w64-mingw32]
    compile-option = "-Woff unused --diagnostic-format=noColor -Woff deprecated -lcrypt32"
    [target.x86_64-w64-mingw32.bin-dependencies]
      path-option = [ "${CANGJIE_STDX_PATH}" ]
  [target.x86_64-unknown-linux-gnu]
    compile-option = "-Woff unused --diagnostic-format=noColor -Woff deprecated -ldl"
    [target.x86_64-unknown-linux-gnu.bin-dependencies]
      path-option = [ "${CANGJIE_STDX_PATH}" ]
  [target.aarch64-unknown-linux-gnu]
    compile-option = "-Woff unused --diagnostic-format=noColor -Woff deprecated -ldl"
    [target.aarch64-unknown-linux-gnu.bin-dependencies]
      path-option = [ "${CANGJIE_STDX_PATH}" ]  