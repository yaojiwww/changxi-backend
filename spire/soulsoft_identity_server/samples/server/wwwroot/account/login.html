<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Soulsoft IdentityServer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f8fafa;
            color: #1a1a1a;
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Header */
        .header {
            background: #ffffff;
            border-bottom: 1px solid #e5e5e5;
            padding: 0;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-section {
            display: flex;
            align-items: baseline;
            gap: 12px;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #008B8B;
            letter-spacing: -0.5px;
            text-decoration: none;
        }

        .logo-subtitle {
            font-size: 14px;
            font-weight: 400;
            color: #666;
        }

        .nav-link {
            color: #666;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: #008B8B;
        }

        /* Main Content */
        .main-content {
            margin-top: 80px;
            padding: 30px 40px;
            min-height: calc(100vh - 80px);
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .login-container {
            max-width: 1100px;
            width: 100%;
            display: grid;
            grid-template-columns: 3fr 420px;
            gap: 80px;
            align-items: start;
        }

        /* Left Side - Welcome */
        .welcome-section {
            padding: 40px 0;
            max-width: 520px;
        }

        .brand-badge {
            display: inline-block;
            padding: 8px 20px;
            background: linear-gradient(135deg, #008B8B 0%, #00A3A3 100%);
            color: white;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            border-radius: 20px;
            margin-bottom: 24px;
        }

        .welcome-title {
            font-size: 46px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 20px;
            letter-spacing: -1px;
            line-height: 1.2;
        }

        .welcome-text {
            font-size: 16px;
            color: #666;
            line-height: 1.8;
            margin-bottom: 32px;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .feature-card {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 20px 16px;
            text-align: center;
            transition: all 0.2s;
        }

        .feature-card:hover {
            border-color: #008B8B;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 139, 139, 0.1);
        }

        .feature-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .feature-title {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 4px;
        }

        .feature-desc {
            font-size: 12px;
            color: #999;
        }

        /* Right Side - Login Form */
        .login-card {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 26px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        .card-title {
            font-size: 20px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 4px;
        }

        .card-subtitle {
            font-size: 12px;
            color: #666;
            margin-bottom: 18px;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 12px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #1a1a1a;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 9px 12px;
            font-size: 13px;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            transition: all 0.2s;
            outline: none;
            background: white;
        }

        .form-input:hover {
            border-color: #c0c0c0;
        }

        .form-input:focus {
            border-color: #008B8B;
            box-shadow: 0 0 0 3px rgba(0, 139, 139, 0.1);
        }

        .form-input::placeholder {
            color: #999;
        }

        .remember-section {
            display: flex;
            align-items: center;
            margin: 8px 0 14px;
        }

        .remember-section input[type="checkbox"] {
            margin-right: 6px;
            width: 14px;
            height: 14px;
            cursor: pointer;
            accent-color: #008B8B;
        }

        .remember-section label {
            font-size: 12px;
            color: #666;
            cursor: pointer;
            user-select: none;
        }

        /* Buttons */
        .btn {
            padding: 9px 18px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            outline: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: #008B8B;
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            background: #006B75;
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(0, 139, 139, 0.25);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: white;
            color: #666;
            border: 1px solid #e0e0e0;
            width: 100%;
            margin-top: 8px;
        }

        .btn-secondary:hover {
            background: #fafafa;
            border-color: #c0c0c0;
        }

        /* External Login */
        .divider {
            display: flex;
            align-items: center;
            margin: 18px 0 14px;
            color: #999;
            font-size: 11px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e5e5;
        }

        .divider span {
            padding: 0 12px;
        }

        .external-providers {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .provider-btn {
            width: 38px;
            height: 38px;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
            font-size: 18px;
        }

        .provider-btn:hover {
            border-color: #008B8B;
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .provider-btn.huawei {
            color: #d32f2f;
        }

        .provider-btn.tencent {
            color: #1e88e5;
        }

        .provider-btn.wechat {
            color: #00c853;
        }

        /* Messages */
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .message.show {
            display: block;
        }

        .error-message {
            background: #fff5f5;
            border-left: 4px solid #e53e3e;
            color: #c53030;
        }

        .success-message {
            background: #f0fff4;
            border-left: 4px solid #38a169;
            color: #22543d;
        }

        .tip-text {
            font-size: 11px;
            color: #666;
            margin-bottom: 14px;
            padding: 8px;
            background: #f8fafa;
            border-radius: 6px;
        }

        .loading-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive */
        @media (max-width: 968px) {
            .login-container {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .welcome-section {
                text-align: center;
                max-width: 100%;
            }

            .brand-badge {
                display: inline-block;
            }

            .welcome-title {
                font-size: 36px;
            }

            .feature-grid {
                grid-template-columns: 1fr;
            }

            .main-content {
                padding: 40px 20px;
            }

            .login-card {
                padding: 32px 24px;
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo-section">
                <a href="/" class="logo">SOULSOFT</a>
                <div class="logo-subtitle">IdentityServer</div>
            </div>
            <a href="/" class="nav-link">返回首页</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="login-container">
            <!-- Left Side - Welcome -->
            <div class="welcome-section">
                <div class="brand-badge">SOULSOFT IDENTITYSERVER</div>
                <h1 class="welcome-title">企业级身份<br>认证解决方案</h1>
                <p class="welcome-text">基于 OAuth 2.0 和 OpenID Connect 国际标准，为您的应用提供安全可靠的统一身份管理服务</p>

                <div class="feature-grid">
                    <div class="feature-card">
                        <div class="feature-icon">🔐</div>
                        <div class="feature-title">安全标准</div>
                        <div class="feature-desc">OAuth 2.0 / OIDC</div>
                    </div>
                    <div class="feature-card">
                        <div class="feature-icon">⚡</div>
                        <div class="feature-title">高性能</div>
                        <div class="feature-desc">响应 &lt; 50ms</div>
                    </div>
                    <div class="feature-card">
                        <div class="feature-icon">🛡️</div>
                        <div class="feature-title">企业级</div>
                        <div class="feature-desc">安全防护</div>
                    </div>
                </div>
            </div>

            <!-- Right Side - Login Form -->
            <div class="login-card">
                <h2 class="card-title">登录</h2>
                <p class="card-subtitle">登录到您的账户</p>

                <div id="errorMessage" class="message error-message"></div>
                <div id="successMessage" class="message success-message"></div>

                <form id="loginForm" action="/account/login" method="POST">
                    <div class="form-group">
                        <label class="form-label" for="username">用户名</label>
                        <input type="text" id="username" name="username" class="form-input"
                               placeholder="请输入用户名" required autocomplete="username" autofocus>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">密码</label>
                        <input type="password" id="password" name="password" class="form-input"
                               placeholder="请输入密码" required autocomplete="current-password">
                    </div>

                    <input type="hidden" id="returnUrl" name="returnUrl" value="">

                    <div class="remember-section">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <label for="rememberMe">记住登录状态</label>
                    </div>

                    <div class="tip-text">
                        提示：使用默认测试账号登录
                    </div>

                    <button type="submit" id="loginButton" class="btn btn-primary">
                        登录
                    </button>

                    <button type="button" id="cancelButton" class="btn btn-secondary">
                        取消
                    </button>
                </form>

                <!-- External Login -->
                <div class="divider">
                    <span>或使用外部账号登录</span>
                </div>

                <div class="external-providers">
                    <button type="button" class="provider-btn huawei" id="huaweiLogin" title="使用华为账号登录">
                        H
                    </button>
                    <button type="button" class="provider-btn tencent" id="tencentLogin" title="使用腾讯QQ登录">
                        Q
                    </button>
                    <button type="button" class="provider-btn wechat" id="wechatLogin" title="使用微信登录">
                        W
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // 从 URL 获取参数
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                error: params.get('error'),
                username: params.get('username'),
                returnUrl: params.get('returnUrl')
            };
        }

        // 页面加载时处理 URL 参数
        window.addEventListener('DOMContentLoaded', function() {
            const params = getUrlParams();

            // 回显错误信息
            if (params.error) {
                const errorMessage = document.getElementById('errorMessage');
                errorMessage.textContent = decodeURIComponent(params.error);
                errorMessage.classList.add('show');
            }

            // 回显用户名
            if (params.username) {
                const usernameInput = document.getElementById('username');
                usernameInput.value = decodeURIComponent(params.username);
            }

            // 填充 returnUrl 隐藏字段
            if (params.returnUrl) {
                const returnUrlInput = document.getElementById('returnUrl');
                returnUrlInput.value = decodeURIComponent(params.returnUrl);
            }
        });

        // 取消按钮处理
        document.getElementById('cancelButton').addEventListener('click', function() {
            const returnUrl = document.getElementById('returnUrl').value;
            if (returnUrl) {
                window.location.href = returnUrl;
            } else {
                window.location.href = '/';
            }
        });
    </script>
</body>

</html>
