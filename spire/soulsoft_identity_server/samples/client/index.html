<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OIDC Client - Soulsoft IdentityServer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: #ffffff;
        color: #1a1a1a;
        line-height: 1.6;
      }

      /* Header */
      .header {
        background: #ffffff;
        border-bottom: 1px solid #e5e5e5;
        padding: 0;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
        backdrop-filter: blur(10px);
        background: rgba(255, 255, 255, 0.95);
      }

      .header-content {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .logo-section {
        display: flex;
        align-items: baseline;
        gap: 12px;
      }

      .logo {
        font-size: 22px;
        font-weight: 700;
        color: #008B8B;
        letter-spacing: -0.5px;
      }

      .logo-subtitle {
        font-size: 14px;
        font-weight: 400;
        color: #666;
      }

      .nav-actions {
        display: flex;
        gap: 16px;
        align-items: center;
      }

      .status-badge {
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        background: #f5f5f5;
        color: #999;
      }

      .status-badge.active {
        background: linear-gradient(135deg, #e8f5f5 0%, #d0eded 100%);
        color: #008B8B;
        border: 1px solid #b8e0e0;
      }

      .btn-auth {
        background: #008B8B;
        color: white;
        padding: 8px 20px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        border: none;
        cursor: pointer;
        transition: all 0.2s;
      }

      .btn-auth:hover {
        background: #006B75;
      }

      .btn-auth.logout {
        background: white;
        color: #666;
        border: 1px solid #e0e0e0;
      }

      .btn-auth.logout:hover {
        background: #fafafa;
        border-color: #c0c0c0;
      }

      .hidden {
        display: none !important;
      }

      /* Hero Section */
      .hero {
        margin-top: 80px;
        padding: 100px 40px 80px;
        background: linear-gradient(180deg, #f8fafa 0%, #ffffff 100%);
      }

      .hero-content {
        max-width: 800px;
        margin: 0 auto;
        text-align: center;
      }

      .hero-content h1 {
        font-size: 52px;
        font-weight: 700;
        color: #1a1a1a;
        line-height: 1.2;
        margin-bottom: 24px;
        letter-spacing: -1px;
      }

      .hero-content .highlight {
        color: #008B8B;
      }

      .hero-content p {
        font-size: 20px;
        color: #666;
        line-height: 1.7;
        margin-bottom: 40px;
        max-width: 700px;
        margin-left: auto;
        margin-right: auto;
      }

      .hero-icon {
        font-size: 80px;
        margin-bottom: 32px;
        opacity: 0.9;
      }

      /* Main Content */
      .main-content {
        margin-top: 80px;
        padding: 60px 40px;
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
      }

      .section {
        margin-bottom: 48px;
      }

      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
      }

      .section-title {
        font-size: 20px;
        font-weight: 600;
        color: #1a1a1a;
        letter-spacing: -0.5px;
      }

      .btn-group {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .btn {
        padding: 10px 20px;
        font-size: 13px;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
        border: none;
        outline: none;
      }

      .btn-secondary {
        background: #f5f5f5;
        color: #1a1a1a;
      }

      .btn-secondary:hover {
        background: #e8e8e8;
        transform: translateY(-1px);
      }

      .btn-danger {
        background: white;
        color: #e53e3e;
        border: 1px solid #ffcccc;
      }

      .btn-danger:hover {
        background: #fff5f5;
        border-color: #ffaaaa;
      }

      /* Cards */
      .card {
        background: white;
        border: 1px solid #e5e5e5;
        border-radius: 12px;
        padding: 28px;
        margin-bottom: 20px;
      }

      .card-label {
        font-size: 11px;
        font-weight: 600;
        color: #999;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 12px;
      }

      pre {
        background: #1a1a1a;
        color: #00ff00;
        padding: 20px;
        border-radius: 8px;
        font-size: 11px;
        line-height: 1.6;
        overflow-x: auto;
        margin: 0;
        font-family: 'SF Mono', 'Monaco', 'Courier New', monospace;
      }

      /* Responsive */
      @media (max-width: 768px) {
        .hero-content h1 {
          font-size: 36px;
        }

        .hero-content p {
          font-size: 16px;
        }

        .main-content {
          padding: 40px 20px;
        }

        .btn-group {
          flex-direction: column;
        }

        .btn {
          width: 100%;
        }

        .section-header {
          flex-direction: column;
          align-items: flex-start;
          gap: 16px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <div class="logo-section">
          <div class="logo">SOULSOFT</div>
          <div class="logo-subtitle">IdentityServer Client</div>
        </div>
        <div class="nav-actions">
          <button id="btn-auth" class="btn-auth">登录</button>
        </div>
      </div>
    </header>

    <!-- Guest Area -->
    <div id="guest-area" class="hidden">
      <section class="hero">
        <div class="hero-content">
          <div class="hero-icon">🔐</div>
          <h1>OIDC <span class="highlight">客户端测试</span></h1>
          <p>基于 OpenID Connect 标准的身份认证测试工具，验证您的身份服务器集成是否正常工作。</p>
        </div>
      </section>
    </div>

    <!-- User Area -->
    <div id="user-area" class="hidden">
      <main class="main-content">
        <div class="container">
          <div class="section">
            <div class="section-header">
              <h2 class="section-title">操作面板</h2>
              <div class="btn-group">
                <button id="btn-api" class="btn btn-secondary">查看 Token</button>
                <button id="btn-order" class="btn btn-secondary">测试 API</button>
              </div>
            </div>
          </div>

          <div class="section">
            <h2 class="section-title">用户信息</h2>
            <div class="card">
              <div class="card-label">Profile Data</div>
              <pre id="profile-display"></pre>
            </div>
          </div>

          <div class="section">
            <h2 class="section-title">API 响应</h2>
            <div class="card">
              <div class="card-label">Response</div>
              <pre id="order-response">点击"测试 API"按钮查看响应结果</pre>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script type="module">
      import { userManager } from "./auth.js";

      const btnAuth = document.getElementById("btn-auth");
      const guestArea = document.getElementById("guest-area");
      const userArea = document.getElementById("user-area");
      const profileDisplay = document.getElementById("profile-display");
      const orderResponse = document.getElementById("order-response");

      (async function init() {
        try {
          const user = await userManager.getUser();
          if (user && !user.expired) {
            showUser(user);
          } else {
            showGuest();
          }
        } catch (err) {
          console.error(err);
          showGuest();
        }
      })();

      function showUser(user) {
        btnAuth.innerText = "退出登录";
        btnAuth.classList.add("logout");
        guestArea.classList.add("hidden");
        userArea.classList.remove("hidden");
        profileDisplay.innerText = JSON.stringify(user.profile, null, 2);
      }

      function showGuest() {
        btnAuth.innerText = "登录";
        btnAuth.classList.remove("logout");
        guestArea.classList.remove("hidden");
        userArea.classList.add("hidden");
      }

      btnAuth.onclick = async () => {
        const user = await userManager.getUser();
        if (user && !user.expired) {
          // 已登录，执行退出
          if (confirm("确定退出登录？")) {
            await userManager.signoutRedirect();
          }
        } else {
          // 未登录，执行登录
          await userManager.signinRedirect();
        }
      };

      document.getElementById("btn-api").onclick = async () => {
        const user = await userManager.getUser();
        console.log("Access Token:", user?.access_token);
        console.log("ID Token:", user?.id_token);
        console.log("Refresh Token:", user?.refresh_token);
        alert("Token 信息已输出到浏览器控制台\n\n请按 F12 打开开发者工具查看");
      };

      document.getElementById("btn-order").onclick = async () => {
        try {
          const user = await userManager.getUser();
          if (!user?.access_token) {
            alert("未找到访问令牌");
            return;
          }

          orderResponse.innerText = "正在请求订单接口...\n请稍候...";

          const response = await fetch("http://127.0.0.1:8080/order", {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${user.access_token}`,
              "Content-Type": "application/json"
            }
          });

          if (response.ok) {
            const data = await response.text();
            orderResponse.innerText = `✓ 请求成功 (${response.status})\n\n${data}`;
            console.log("订单接口响应:", data);
          } else {
            const errorText = await response.text();
            orderResponse.innerText = `✗ 请求失败 (${response.status})\n\n${errorText}`;
            console.error("请求失败:", response.status, errorText);
          }
        } catch (err) {
          orderResponse.innerText = `✗ 请求异常\n\n${err.message}`;
          console.error("请求异常:", err);
        }
      };
    </script>
  </body>
</html>
