[package]
  cjc-version = "1.1.0"
  name = "soulsoft_web_authentication_jwtbearer"
  description = "JWT Bearer 身份认证库，支持基于 Bearer Token 的 Web 认证。"
  output-type = "static"
  version = "1.0.0"

[dependencies]
  soulsoft_net_http = { path = "../soulsoft_net_http"}
  soulsoft_web_http = { path = "../soulsoft_web_http"}
  soulsoft_identity_claims = { path = "../soulsoft_identity_claims"}
  soulsoft_identity_tokens = { path = "../soulsoft_identity_tokens"}
  soulsoft_identity_tokens_jwt = { path = "../soulsoft_identity_tokens_jwt"}
  soulsoft_web_authentication = { path = "../soulsoft_web_authentication"}
  soulsoft_extensions_options = { path = "../soulsoft_extensions_options"}
  soulsoft_extensions_logging = { path = "../soulsoft_extensions_logging"}
  soulsoft_identity_protocols = { path = "../soulsoft_identity_protocols"}
  soulsoft_extensions_injection = { path = "../soulsoft_extensions_injection"}
  soulsoft_identity_protocols_oidc = { path = "../soulsoft_identity_protocols_oidc"}
  soulsoft_extensions_configuration = { path = "../soulsoft_extensions_configuration"}

[target]
  [target.x86_64-w64-mingw32]
    compile-option = "-Woff unused --diagnostic-format=noColor -Woff deprecated -lcrypt32"
    [target.x86_64-w64-mingw32.bin-dependencies]
      path-option = [ "${CANGJIE_STDX_PATH}" ]
  [target.x86_64-unknown-linux-gnu]
    compile-option = "-Woff unused --diagnostic-format=noColor -Woff deprecated -ldl"
    [target.x86_64-unknown-linux-gnu.bin-dependencies]
      path-option = [ "${CANGJIE_STDX_PATH}" ]
  [target.aarch64-unknown-linux-gnu]
    compile-option = "-Woff unused --diagnostic-format=noColor -Woff deprecated -ldl"
    [target.aarch64-unknown-linux-gnu.bin-dependencies]
      path-option = [ "${CANGJIE_STDX_PATH}" ]
